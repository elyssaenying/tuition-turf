name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock pytest==9.1.1

      - name: Run public Python tests (no private data required)
        run: PYTHONPATH=src python -m pytest -q --strict-markers -m "not local_data"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app
        run: npm ci

      - name: Build dashboard
        working-directory: app
        run: npm run build
